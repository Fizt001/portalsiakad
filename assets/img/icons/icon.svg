    <circle cx="256" cy="256" r="150" fill="#1e293b" fill-opacity="0.5" stroke="url(#primaryGrad2)" stroke-width="4" stroke-opacity="0.5"/>

    <g filter="url(#glow2)">
      <path d="M256 135 L405 205 L256 275 L107 205 Z" fill="url(#primaryGrad2)"/>
      <path d="M160 230 L160 295 C160 348 352 348 352 295 L352 230 L256 275 Z" fill="url(#accentGrad2)" opacity="0.95"/>
      <path d="M388 215 L388 300 L380 316" stroke="#facc15" stroke-width="9" stroke-linecap="round" fill="none"/>
      <circle cx="380" cy="324" r="9" fill="#facc15"/>
      <path d="M185 355 L185 388 L327 388 L327 355" stroke="url(#primaryGrad2)" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M216 388 L216 372 L296 372 L296 388" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none"/>
