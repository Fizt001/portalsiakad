<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Solid 100% Full Edge-to-Edge Background (Required for Android Maskable & Apple Touch Icon) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Centered Emblem with Safe Zone margin -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)">
    <!-- Glowing Emblem Ring -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="12 8"/>
    <circle cx="256" cy="256" r="150" fill="#1e293b" fill-opacity="0.4" stroke="url(#primaryGrad)" stroke-width="3" stroke-opacity="0.4"/>

    <!-- Academic Portal Icon (Graduation Cap + Gateway) -->
    <g filter="url(#glow)">
      <!-- Cap Top Diamond -->
      <path d="M256 140 L396 205 L256 270 L116 205 Z" fill="url(#primaryGrad)"/>
      
      <!-- Cap Under Layer -->
      <path d="M166 228 L166 288 C166 338 346 338 346 288 L346 228 L256 270 Z" fill="url(#accentGrad)" opacity="0.95"/>
      
      <!-- Tassel String and Ball -->
      <path d="M380 215 L380 295 L372 310" stroke="#facc15" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="372" cy="318" r="8" fill="#facc15"/>

      <!-- Gateway Pillars Base -->
      <path d="M190 350 L190 380 L322 380 L322 350" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M220 380 L220 365 L292 365 L292 380" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>